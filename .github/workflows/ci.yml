name: First CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: First message
        run: echo "Pipeline started"

      - name: Show files before checkout
        run: ls

      - name: Checkout repository
        uses: actions/checkout

      - name: Show files after checkout
        run: ls

      - name: Print package file
        run: cat package.json

      - name: Finish massage
        run: echo "Pipeline finished"